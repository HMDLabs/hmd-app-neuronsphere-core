{% extends "base.html" %}

{% block title %}Access Denied - NeuronSphere{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-20">
    <div class="text-center">
        <svg class="mx-auto h-16 w-16 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h2 class="mt-4 text-xl font-semibold text-gray-900">Access Denied</h2>
        <p class="mt-2 text-gray-600">
            You don't have {{ role_required }} access to {{ environment }}.
        </p>
        <p class="mt-1 text-sm text-gray-500">
            Contact your administrator if you need access to this environment.
        </p>
        <a href="{% url 'deployments:dashboard' %}"
           class="mt-6 inline-block px-4 py-2 bg-ns-magenta text-white rounded-md hover:bg-ns-navy transition-colors">
            Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
