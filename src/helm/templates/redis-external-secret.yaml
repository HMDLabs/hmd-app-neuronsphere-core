{{- /*
The `redis` dependency is optional (BACON manifest: required=false) so existing
deploys keep working before it's added to a deployment set. Only render this
ExternalSecret once the dependency is actually resolved -- otherwise
`redisSecretName` would build a key from empty instance/deployment_id segments
and sync a garbage/non-existent Secrets Manager entry.
*/}}
{{- if index .Values "dependencies" "redis" -}}
{{- $secretStoreName := include "ns.secretStoreName" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ template "hmd-app-neuronsphere.fullname" . }}-redis-secret
spec:
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ template "hmd-app-neuronsphere.fullname" . }}-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ include "redisSecretName" . }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ include "redisSecretName" . }}
        property: password
{{- end }}
