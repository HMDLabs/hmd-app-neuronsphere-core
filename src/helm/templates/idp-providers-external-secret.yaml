{{- /*
Multi-provider SSO. `config.idpProvidersSecret` names a secret in the store whose
`providers` property holds the OAUTH_PROVIDERS JSON list -- one entry per identity
provider (Okta, Auth0, Entra, or a customer's own), each with its own client_id,
client_secret, server_url and groups_claim.

It lives in the secret store rather than in values or the ConfigMap because the
entries carry client secrets. Independent of `config.oktaAuth`: a customer running
only Auth0 sets this and leaves the legacy single-Okta path off entirely, while a
deployment that sets neither registers no provider and falls back to the
username/password superuser the init container creates.
*/}}
{{- if .Values.config.idpProvidersSecret }}
{{- $secretStoreName := include "ns.secretStoreName" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idp-providers
spec:
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: idp-providers
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_PROVIDERS
      remoteRef:
        key: {{ .Values.config.idpProvidersSecret }}
        property: providers
{{- end }}
