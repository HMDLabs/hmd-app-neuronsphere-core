{{- /*
The MCP gateway's own IdP client (NERD012 SPEC007). `config.mcpGatewayIdpSecret`
names a secret in the store with `client_id` and `client_secret` properties: a
machine-to-machine (client credentials) client registered for the gateway alone,
granted one scope per environment (mcp:dev, mcp:test, ...). Service-mode upstreams
accept only tokens issued to this client, which is what keeps callers from going
around the gateway's environment check.

A separate client from the deployment service account (SERVICE_CLIENT_ID), so a
token for one can never be used as the other.
*/}}
{{- if .Values.config.mcpGatewayIdpSecret }}
{{- $secretStoreName := include "ns.secretStoreName" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-gateway-idp
spec:
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mcp-gateway-idp
    creationPolicy: Owner
  data:
    - secretKey: MCP_GATEWAY_IDP_CLIENT_ID
      remoteRef:
        key: {{ .Values.config.mcpGatewayIdpSecret }}
        property: client_id
    - secretKey: MCP_GATEWAY_IDP_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.config.mcpGatewayIdpSecret }}
        property: client_secret
{{- end }}
