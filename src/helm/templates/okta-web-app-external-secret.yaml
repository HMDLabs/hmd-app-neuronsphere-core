{{- /*
Okta is real SaaS identity that Floci does not emulate, so the local deploy runs
without it (`config.oktaAuth: false`) and omits the `okta-app` dependency role
altogether. The role lookups below are unconditional and would fail at *render*
time on a nil `dependencies.okta-app`, so the guard has to wrap the entire file
rather than just the resources -- the same reason redis-external-secret.yaml
guards on its optional dependency before touching it.
*/}}
{{- if .Values.config.oktaAuth }}
{{- $secretStoreName := include "ns.secretStoreName" . -}}
{{- $oktaAppInstanceName := index $.Values "dependencies" "okta-app" "instance_name" -}}
{{- $oktaAppRepoName := index $.Values "dependencies" "okta-app" "repo_name" -}}
{{- $oktaAppDid := index $.Values "dependencies" "okta-app" "deployment_id" -}}
{{- $oktaAppSecretName := printf "okta-%s-%s-%s-web" $oktaAppInstanceName $oktaAppRepoName $oktaAppDid -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: okta-web-application
spec:
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: okta-web-application
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: {{ $oktaAppSecretName }}
        property: client_id
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: {{ $oktaAppSecretName }}
        property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: okta-global
spec:
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: okta-global
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_PROVIDER_URL
      remoteRef:
        key: okta
        property: ns_issuer
{{- end }}
