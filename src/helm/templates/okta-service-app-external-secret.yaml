{{- /*
The service account the GUI calls hmd-ms-deployment as when there is no user token
to forward: MCP gateway discovery, and MCP API-key callers. AuthTokenManager reads
SERVICE_CLIENT_ID / SERVICE_CLIENT_SECRET and fetches a client-credentials token
from SERVICE_TOKEN_ISSUER.

The client is a service-type hmd-inf-okta-app instance on the optional
`okta-service-app` role; its secret is named without the "-web" suffix the web app's
carries. The issuer is `services_issuer`, not the `ns_issuer` users log in against:
hmd-lib-auth checks any token whose client is not a trusted human client against
`services_issuer` and the `api://neuronsphere-services` audience, so a
client-credentials token from the login issuer is refused as Unauthorized.

Guarded like okta-web-app-external-secret.yaml: the role lookups fail at render time
when the role is absent, so the whole file sits inside the guard.
*/}}
{{- if and .Values.config.oktaAuth (hasKey (.Values.dependencies | default dict) "okta-service-app") }}
{{- $secretStoreName := include "ns.secretStoreName" . -}}
{{- $serviceApp := index $.Values "dependencies" "okta-service-app" -}}
{{- $serviceAppSecretName := printf "okta-%s-%s-%s" $serviceApp.instance_name $serviceApp.repo_name $serviceApp.deployment_id -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: okta-service-application
spec:
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: okta-service-application
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_CLIENT_ID
      remoteRef:
        key: {{ $serviceAppSecretName }}
        property: client_id
    - secretKey: SERVICE_CLIENT_SECRET
      remoteRef:
        key: {{ $serviceAppSecretName }}
        property: client_secret
    - secretKey: SERVICE_TOKEN_ISSUER
      remoteRef:
        key: okta
        property: services_issuer
{{- end }}
