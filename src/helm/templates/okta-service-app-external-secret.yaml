{{- /*
The service account the GUI calls hmd-ms-deployment as when there is no user token
to forward: MCP gateway discovery, and MCP API-key callers. AuthTokenManager reads
SERVICE_CLIENT_ID / SERVICE_CLIENT_SECRET and fetches a client-credentials token
from SERVICE_TOKEN_ISSUER.

The client is an Okta service app the CDKTF stack creates for this instance
(src/cdktf/cdktf_local.py), so its secret is named from this instance's identity,
like the Django secret. The issuer is `services_issuer`, not the `ns_issuer` users
log in against: hmd-lib-auth checks any token whose client is not a trusted human
client against `services_issuer` and the `api://neuronsphere-services` audience, so
a client-credentials token from the login issuer is refused as Unauthorized.
*/}}
{{- if .Values.config.oktaAuth }}
{{- $secretStoreName := include "ns.secretStoreName" . -}}
{{- $serviceAppSecretName := printf "okta-%s-%s-%s" .Values.env.HMD_INSTANCE_NAME .Values.env.HMD_REPO_NAME .Values.env.HMD_DID -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: okta-service-application
spec:
  secretStoreRef:
    name: {{ $secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: okta-service-application
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_CLIENT_ID
      remoteRef:
        key: {{ $serviceAppSecretName }}
        property: client_id
    - secretKey: SERVICE_CLIENT_SECRET
      remoteRef:
        key: {{ $serviceAppSecretName }}
        property: client_secret
    - secretKey: SERVICE_TOKEN_ISSUER
      remoteRef:
        key: okta
        property: services_issuer
{{- end }}
